name: Verify and Package / 验证与打包

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test CodexTaskMonitor.sln --configuration Release --nologo
      - name: Test release privacy checks
        shell: pwsh
        run: ./tests/ReleaseChecks.Tests.ps1
      - name: Audit package vulnerabilities
        shell: pwsh
        run: |
          dotnet list CodexTaskMonitor.sln package --vulnerable --include-transitive --format json | Out-File package-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Package audit failed.' }
          $audit = Get-Content package-audit.json -Raw | ConvertFrom-Json
          if ($audit.errors.Count -gt 0) { throw 'Package audit was incomplete.' }
          foreach ($project in $audit.projects) {
            foreach ($framework in $project.frameworks) {
              if (@($framework.topLevelPackages).Where({ $_.vulnerabilities.Count -gt 0 }).Count -gt 0 -or
                  @($framework.transitivePackages).Where({ $_.vulnerabilities.Count -gt 0 }).Count -gt 0) {
                throw 'Known package vulnerabilities must be reviewed before release.'
              }
            }
          }
      - name: Publish self-contained executable
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Package release
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/publish/win-x64/* -DestinationPath CodexTaskMonitor-win-x64.zip
          $hash = (Get-FileHash CodexTaskMonitor-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CodexTaskMonitor-win-x64.zip" | Set-Content SHA256SUMS.txt
          Copy-Item docs/RELEASE_NOTES.md RELEASE_NOTES.md
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CodexTaskMonitor-win-x64
          path: |
            CodexTaskMonitor-win-x64.zip
            SHA256SUMS.txt
            RELEASE_NOTES.md

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: CodexTaskMonitor-win-x64
      - name: Create preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --notes-file RELEASE_NOTES.md CodexTaskMonitor-win-x64.zip SHA256SUMS.txt
