name: Bug report / 问题反馈
description: Report a reproducible monitoring, notification, or desktop-pet problem. 反馈可复现的任务监听、通知或桌宠问题。
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Chinese or English is welcome. Do not include real task prompts, API tokens, usernames, emails or private paths/screenshots. 欢迎中英文，请勿上传真实提示词、令牌、用户名、邮箱、私人路径或对话截图。"
  - type: input
    id: version
    attributes:
      label: App version or commit / 程序版本或提交
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction steps / 实际结果与复现步骤
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics summary / 诊断摘要
      description: "Include task count and last scan status only; redact titles and paths. 仅提供任务数、最近扫描状态等脱敏摘要，不要上传原始日志或数据库。"
